# Apache-Snippet: SecondBrainWiki-MCP-Server unter /mcp einer bestehenden Site
#
# Wird per Include in einen vorhandenen <VirtualHost *:443> eingebunden.
# Enthält nur einen <Location /mcp>-Block und lässt den Rest der Site unberührt.
# Der Server selbst lauscht nur auf 127.0.0.1:8000 (config.json).
#
# Installation: am einfachsten mit install.sh im Projektordner, sonst von Hand (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http
#   sudo cp apache-llm-wiki.conf /etc/apache2/llm-wiki-mcp.conf
#   sudo chown root:root /etc/apache2/llm-wiki-mcp.conf
#   sudo chmod 640 /etc/apache2/llm-wiki-mcp.conf          # enthält den Token
#
# In der bestehenden Site (sites-available/<site>.conf) innerhalb von
# <VirtualHost *:443> eintragen – vor einem eventuellen "ProxyPass /":
#   Include /etc/apache2/llm-wiki-mcp.conf
#
# Danach:
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Anzupassen: <Token>.

<Location /mcp>
    # Nur Anfragen mit genau diesem Token werden durchgelassen
    Require expr "%{HTTP:Authorization} == 'Bearer <Token>'"

    # Mehrere Tokens (z. B. einer pro Benutzer) stattdessen so:
    # Require expr "%{HTTP:Authorization} in { 'Bearer <Token-1>', 'Bearer <Token-2>' }"

    # Off = Apache schickt "Host: 127.0.0.1:8000" ans Backend.
    # Das MCP-SDK prüft den Host-Header (Schutz gegen DNS-Rebinding) und würde
    # den öffentlichen Hostnamen sonst mit 421 ablehnen.
    # Gilt nur für /mcp, die übrige Site behält ihre Einstellung.
    ProxyPreserveHost Off

    # Streamable HTTP hält Verbindungen (SSE) lange offen und braucht
    # ungepufferte Antworten
    ProxyPass        http://127.0.0.1:8000/mcp flushpackets=on timeout=3600
    ProxyPassReverse http://127.0.0.1:8000/mcp

    # Keine Kompression, sonst puffert mod_deflate die SSE-Antworten
    SetEnv no-gzip 1
</Location>
