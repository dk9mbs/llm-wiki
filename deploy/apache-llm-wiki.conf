# Apache als Reverse Proxy für den SecondBrainWiki-MCP-Server
#
# Der Server selbst lauscht nur auf 127.0.0.1:8000 (config.json).
# Apache nimmt HTTPS entgegen, prüft den Bearer-Token und leitet nur /mcp weiter.
#
# Installation (Debian/Ubuntu):
#   sudo a2enmod ssl proxy proxy_http
#   sudo cp apache-llm-wiki.conf /etc/apache2/sites-available/llm-wiki.conf
#   sudo chmod 640 /etc/apache2/sites-available/llm-wiki.conf   # enthält den Token
#   sudo a2ensite llm-wiki
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Anzupassen: ServerName, Zertifikatspfade, <Token>.

# HTTP nur auf HTTPS umleiten
<VirtualHost *:80>
    ServerName wiki-mcp.example.local
    Redirect permanent / https://wiki-mcp.example.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName wiki-mcp.example.local

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/wiki-mcp.crt
    SSLCertificateKeyFile /etc/ssl/private/wiki-mcp.key

    ProxyRequests Off
    # Off = Apache schickt "Host: 127.0.0.1:8000" ans Backend.
    # Das MCP-SDK prüft den Host-Header (Schutz gegen DNS-Rebinding) und würde
    # den öffentlichen Hostnamen sonst mit 421 ablehnen.
    ProxyPreserveHost Off
    # Streamable HTTP hält Verbindungen (SSE) lange offen
    ProxyTimeout 3600

    # Standard: alles sperren. Muss VOR <Location /mcp> stehen,
    # weil spätere <Location>-Blöcke frühere überschreiben.
    <Location />
        Require all denied
    </Location>

    <Location /mcp>
        # Nur Anfragen mit genau diesem Token werden durchgelassen
        Require expr "%{HTTP:Authorization} == 'Bearer <Token>'"

        # Mehrere Tokens (z. B. einer pro Benutzer) stattdessen so:
        # Require expr "%{HTTP:Authorization} in { 'Bearer <Token-1>', 'Bearer <Token-2>' }"

        ProxyPass        http://127.0.0.1:8000/mcp flushpackets=on
        ProxyPassReverse http://127.0.0.1:8000/mcp

        # Keine Kompression, sonst puffert mod_deflate die SSE-Antworten
        SetEnv no-gzip 1
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/llm-wiki-error.log
    CustomLog ${APACHE_LOG_DIR}/llm-wiki-access.log combined
</VirtualHost>
